name: CI

on:
  pull_request:
    # Equivalent to ignoring Markdown, with plugin documentation re-included.
    # paths-ignore cannot express these exceptions.
    paths:
      - '**'
      - '!**/*.md'
      - 'plugins/orcexe/skills/**'
      - 'plugins/orcexe/commands/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'plugins/orcexe/skills/**'
      - 'plugins/orcexe/commands/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_marketplace.py
      - run: python tests/tools/run_tests.py
