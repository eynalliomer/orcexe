name: Slow tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    paths:
      - 'plugins/orcexe/src/orcexe/redact*.py'
      - 'plugins/orcexe/src/orcexe/classify.py'
      - 'plugins/orcexe/src/orcexe/miniyaml.py'

permissions:
  contents: read

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  slow:
    # 3.9 is in the ubuntu-22.04 toolcache, not in ubuntu-latest (24.04) (T63b).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - run: ORCEXE_SLOW_TESTS=1 python tests/tools/run_tests.py
