# Synthetic test manifest; install remains inert even with shell-looking text.
schema: orcexe.manifest.v1
tool: codex
family: openai
binary: [codex]
bin_env: ORCEXE_BIN_CODEX
min_version: '0.159.0'
version_cmd: [codex, --version]
version_regex: '(\d+\.\d+\.\d+)'
version_sample: 'codex-cli 0.163.0'
verified_on: {date: '2026-11-14', version: '0.163.0', os: macos-arm64}
install: {example: 'echo $(do-not-execute) --yolo'}
auth:
  status_cmd: [codex, login, status]
  logged_in: {json_field: isAuthenticated, equals: true}
  logged_out: {json_field: isAuthenticated, equals: false}
  login_cmd: [codex, login]
  device_cmd: [codex, login, --device-auth]
  plan: {source: app-server, method: account/read, field: planType}
  allowed_fields: [planType]
  forbidden_fields: [email, workspaceRouting]
models: {source: none}
quota: {source: none, fields: [], nullable_fields: [], read_only_consumes_quota: false, exec_exhaustion: null}
exec:
  argv: [codex, exec, -C, '{workdir}', -m, '{model}', '{prompt}']
  stdin: devnull
  requires_git_repo: true
  effort: {mode: config, values: [low, high], model_dependent: true}
  profiles: {write: {extra: [-s, workspace-write]}, review: {extra: [-s, read-only], read_only: true}}
  forbidden_argv: [--locally-forbidden]
events:
  format: jsonl
  stream: stdout
  types: [turn.completed, turn.failed, 'item.*']
  success: {last_type: turn.completed, absent_types: [turn.failed]}
  final_text: {type: item.completed, item_type: agent_message, field: item.text}
  usage: {type: turn.completed, map: {input: usage.input_tokens, cached_read: usage.cached_input_tokens, output: usage.output_tokens, reasoning: usage.reasoning_output_tokens}}
  model_actual: null
  error: {field: error.message, format: text}
exit_codes: {usage: 2, runtime: 1}
side_effects: []
windows: {native: true, sandbox_native: true, wsl2: true, wsl1: false}
evidence:
  binary: Y
  min_version: D
  version_cmd: Y
  version_regex: Y
  version_sample: Y
  verified_on: Y
  install: '?'
  auth: '?'
  models: '?'
  quota: '?'
  exec: '?'
  exec.profiles.review: D+Y
  events: '?'
  exit_codes: '?'
  side_effects: '?'
  windows: D
