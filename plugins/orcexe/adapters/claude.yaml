# Measured 2026-11-14 and rechecked 2026-11-17, Claude Code 2.1.310.
schema: orcexe.manifest.v1
tool: claude-code
family: anthropic
binary: [claude]
bin_env: ORCEXE_BIN_CLAUDE_CODE
min_version: '2.1.310'
version_cmd: [claude, --version]
version_regex: '(\d+\.\d+\.\d+)'
version_sample: '2.1.310 (Claude Code)'
verified_on: {date: '2026-11-17', version: '2.1.310', os: macos-arm64}
install: {npm: 'npm install -g @anthropic-ai/claude-code'}
auth:
  status_cmd: [claude, auth, status, --json]
  logged_in: {json_field: loggedIn, equals: true}
  logged_out: {json_field: loggedIn, equals: false}
  login_cmd: [claude, auth, login]
  device_cmd: [claude, auth, login]
  plan: {source: cmd, cmd: [claude, auth, status, --json], field: subscriptionType}
  allowed_fields: [loggedIn, authMethod, subscriptionType, apiProvider]
  forbidden_fields: [email, orgId, orgName, configDirectory, projectsDirectory]
models: {source: none}
quota:
  source: stream
  event: rate_limit_event
  fields: [status, unifiedWindows.five_hour.utilization, unifiedWindows.five_hour.resetsAt, unifiedWindows.seven_day.utilization, unifiedWindows.seven_day.resetsAt]
  nullable_fields: []
  read_only_consumes_quota: true
  exec_exhaustion: rejected
exec:
  # exec.positional_first: true — Y: prompt-first argv verified by a real run 2026-11-17 (claude 2.1.310, haiku)
  # --add-dir, --allowedTools and --disallowedTools consume through the next flag.
  argv: [claude, -p, '{prompt}', --output-format, stream-json, --verbose, --model, '{model}', --effort, '{effort}', --no-session-persistence, --strict-mcp-config, --include-hook-events, --add-dir, '{run_dir}/brief']
  workdir_via: cwd
  stdin: devnull
  requires_git_repo: false
  effort: {mode: flag, values: [low, medium, high, xhigh, max], model_dependent: true}
  profiles:
    write: {extra: [--permission-mode, acceptEdits, --disallowedTools, 'Bash,WebFetch,WebSearch']}
    # Plan mode alone permits Bash; explicitly deny execution and web tools.
    review: {extra: [--permission-mode, plan, --disallowedTools, 'Bash,WebFetch,WebSearch'], read_only: true}
    # T38c provenance: Claude Code 2.1.310, local --version/--help rechecked 2026-11-19.
    # Help lines (wrapped):
    # --restricted  Restricted mode: removes the built-in tools that run commands
    # or code (Bash, PowerShell and the other code-running tools) and WebFetch
    # unless --tools names them, and ignores user, project and local settings
    # files (managed settings and --settings still apply; add --strict-mcp-config
    # to skip MCP servers too). Also confines the file tools to the working
    # directories (--add-dir included), refuses bypassPermissions, and lets only
    # a person or the configured permission handler approve writes to settings,
    # git and tool-configuration files.
    # --safe-mode  Start with all customizations (CLAUDE.md, skills, installed
    # plugins, hooks, MCP servers, custom commands and agents, output styles,
    # workflows, custom themes, keybindings, and more) disabled — useful for
    # troubleshooting a broken configuration. Admin-managed (policy) settings
    # still apply. Auth, model selection, built-in tools and plugins, and
    # permissions work normally. Sets CLAUDE_CODE_SAFE_MODE=1.
    # Runtime evidence supplied by the task's main session (same CLI version):
    # A committed .Claude/settings.json SessionStart hook ran with plan alone;
    # restricted + safe-mode + strict-mcp-config + Read,Glob,Grep suppressed it,
    # retained subscription authentication, and answered correctly. --bare is forbidden.
    manager: {extra: [--permission-mode, plan, --restricted, --safe-mode, --tools, 'Read,Glob,Grep'], read_only: true}
  forbidden_argv: [--dangerously-skip-permissions, bypassPermissions, --bare, --plugin-url]
events:
  format: jsonl
  stream: stdout
  types: [system, assistant, user, rate_limit_event, result]
  success: {last_type: result, absent_types: []}
  final_text: {type: result, item_type: success, field: result}
  usage:
    type: result
    map: {input: usage.input_tokens, cached_read: usage.cache_read_input_tokens, output: usage.output_tokens, reasoning: unavailable}
  model_actual: system.init.model
  error: {field: result, format: text}
exit_codes: {usage: 1, runtime: 1}
# Ordinary -p runs user/project hooks; the manager profile suppresses them with
# --restricted and --safe-mode. --bare would disable subscription authentication.
# acceptEdits also permits edits in --add-dir (the brief directory). This is
# limited to run_dir/brief, which contains only brief.md. Evidence files stay
# outside that grant and are opened without following symlinks. Cost is list price, not a bill.
side_effects: []
windows: {native: true, sandbox_native: false, wsl2: true, wsl1: false}
evidence:
  binary: Y
  min_version: Y
  version_cmd: Y
  version_regex: Y
  version_sample: Y
  verified_on: Y
  install: '?'
  auth: Y
  models: Y
  quota: Y
  exec: Y
  exec.argv: Y # verified by a real orcexe do run 2026-11-17
  events: Y
  exit_codes: Y
  side_effects: Y
  windows: '?'
